<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirm Completion | HelpLink</title>
    <link rel="stylesheet" href="completion.css">
</head>
<body>
    <header>
        <a class="logo" href="index.html">HelpLink</a>
        <nav aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="my-requests.html">My Requests</a>
            <a href="my-offers.html">My Offers</a>
            <a href="notifications.html">Notifications</a>
            <a href="my-profile.html">Profile</a>
        </nav>
    </header>
    <div class="content">
        <p class="account">Client view | Helper says work is finished</p>
        <h1>Has the requested help been completed?</h1>
        <div class="actions">
            <button type="button">Confirm Completion</button>
            <a class="button" href="collaboration.html">Needs More Work</a>
        </div>
        <p>If more work is needed, message Hadi before confirming completion.</p>
        <form>
            <label for="rating">Rating (after completion)</label>
            <select id="rating">
                <option>5 / 5</option><option>4 / 5</option><option>3 / 5</option><option>2 / 5</option><option>1 / 5</option>
            </select>
            <label for="feedback">Feedback</label>
            <textarea id="feedback" rows="3">Hadi explained the validation fixes clearly.</textarea>
            <div class="actions"><button type="button">Submit Review</button></div>
        </form>
        <a href="my-requests.html#history">View request history</a>
    </div>
    <footer>HelpLink | Helping each other</footer>
</body>
</html>
